# Local PostgreSQL for development (optional — a Homebrew/system Postgres works too).
#   docker compose up -d db
# then in backend/.env:
#   DATABASE_URL=postgres://portfolio:portfolio@localhost:5432/portfolio
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
